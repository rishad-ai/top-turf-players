name: Database backup

# Nightly backup of the production Neon database.
# Runs at 00:00 IST (18:30 UTC) daily — after the morning match has been entered —
# and can also be run on demand from the Actions tab (Run workflow).
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "::error::Secret BACKUP_DATABASE_URL is not set."
            exit 1
          fi
          stamp=$(date -u +%Y-%m-%d_%H%M)
          # Custom format (-Fc) is compressed and restores with pg_restore.
          pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-privileges -Fc -f "topturf-$stamp.dump"
          ls -lh topturf-*.dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: topturf-db-backup-${{ github.run_id }}
          path: topturf-*.dump
          retention-days: 90
