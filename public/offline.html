<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOP Turf Players — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAF7;
      color: #101826;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 320px;
    }
    .badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(180deg, #1E7A46, #145C34);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      font-size: 14px;
      color: #5B6474;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">TT</div>
    <h1>You're offline</h1>
    <p>This page needs a connection to load fresh match data. Reconnect and try again.</p>
  </div>
</body>
</html>
